services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/app.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    env_file:
      - path: .env
        required: false
    volumes:
      - rag-data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  rag-data:

