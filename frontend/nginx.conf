server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
