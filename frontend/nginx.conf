server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_buffering off;
  }

  location = /initial {
    try_files /initial/index.html =404;
  }

  location /initial/ {
    try_files $uri $uri/ /initial/index.html;
  }

  location ~ ^/(database|pdf|admin)/?$ {
    try_files /second/index.html =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    return 302 /initial;
  }
}
